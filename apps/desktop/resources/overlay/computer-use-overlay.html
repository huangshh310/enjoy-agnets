<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enjoy Agents · Desktop overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }

    /* 冷静蓝边：对齐 cu-p0-c-overlay.html .cu-overlay，勿霓虹警报色 */
    .cu-overlay-frame {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .cu-overlay-frame.is-on { display: block; }

    .cu-border {
      position: fixed;
      inset: 6px;
      border: 2px solid rgba(43, 109, 229, 0.55);
      border-radius: 12px;
      animation: breathe 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 0 2px rgba(43, 109, 229, 0.55), 0 0 0 6px rgba(43, 109, 229, 0.12); }
      50% { box-shadow: 0 0 0 3px rgba(43, 109, 229, 0.75), 0 0 0 10px rgba(43, 109, 229, 0.08); }
    }

    .cu-hud {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 280px;
      max-width: min(560px, calc(100vw - 48px));
      padding: 6px 10px 6px 14px;
      border-radius: 10px;
      border: 1px solid rgba(228, 231, 235, 0.9);
      background: rgba(238, 243, 252, 0.94);
      color: #0f1419;
      pointer-events: auto;
    }

    .cu-title {
      font-size: 12px;
      font-weight: 600;
      color: #2b6de5;
      letter-spacing: -0.1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cu-hud-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .cu-esc {
      font-size: 10px;
      color: #5c6670;
    }

    .cu-stop {
      border: 1px solid #e4e7eb;
      border-radius: 6px;
      background: #ffffff;
      color: #0f1419;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      cursor: pointer;
      pointer-events: auto;
    }
    .cu-stop:hover { background: #f7f8fa; }
  </style>
</head>
<body>
  <div id="frame" class="cu-overlay-frame" data-testid="cu-overlay-frame">
    <div class="cu-border" aria-hidden="true"></div>
    <div id="hud" class="cu-hud">
      <span id="title" class="cu-title">正在操控 · 桌面</span>
      <div class="cu-hud-actions">
        <span id="escHint" class="cu-esc">按 Esc 停止</span>
        <button type="button" id="stop" class="cu-stop" data-testid="cu-overlay-stop">停止</button>
      </div>
    </div>
  </div>
  <script>
    const frame = document.getElementById("frame")
    const title = document.getElementById("title")
    const stop = document.getElementById("stop")
    const escHint = document.getElementById("escHint")
    const hud = document.getElementById("hud")

    const border = document.querySelector(".cu-border")
    function applyChrome(payload) {
      const visible = Boolean(payload && payload.visible)
      frame.classList.toggle("is-on", visible)
      if (!visible) return
      if (payload.title) title.textContent = payload.title
      if (payload.stopLabel) stop.textContent = payload.stopLabel
      if (payload.escHint) escHint.textContent = payload.escHint
      if (payload.lang) document.documentElement.lang = payload.lang
      if (border) {
        border.style.borderColor = payload.pointerColor || ""
        border.style.boxShadow = payload.pointerColor ? "0 0 0 6px " + payload.pointerColor : ""
      }
    }

    window.addEventListener("overlay-chrome", (event) => {
      applyChrome(event.detail || {})
    })

    stop.addEventListener("click", () => {
      window.dispatchEvent(new CustomEvent("overlay-stop"))
    })

    hud.addEventListener("mouseenter", () => {
      window.dispatchEvent(new CustomEvent("overlay-ignore-mouse", { detail: false }))
    })
    hud.addEventListener("mouseleave", () => {
      window.dispatchEvent(new CustomEvent("overlay-ignore-mouse", { detail: true }))
    })
  </script>
</body>
</html>
