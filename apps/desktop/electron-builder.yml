appId: com.enjoyagents.desktop
productName: Enjoy Agents
executableName: enjoy-agents
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
extraResources:
  - from: native/computer-use/pack
    to: bin
    filter:
      - "**/*"
beforePack: scripts/stage-computer-use.cjs
npmRebuild: true
publish:
  provider: github
  owner: huangshh310
  repo: enjoy-agnets
  releaseType: release
win:
  executableName: enjoy-agents
  icon: icon.ico
  artifactName: enjoy-agents-${version}-win.${ext}
nsis:
  artifactName: enjoy-agents-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
mac:
  icon: icon.icns
  category: public.app-category.developer-tools
  artifactName: enjoy-agents-${version}-mac.${ext}
  entitlements: build/entitlements.mac.plist
  extendInfo:
    CFBundleName: Enjoy Agents
    CFBundleDisplayName: Enjoy Agents
    NSAppleEventsUsageDescription: Enjoy Agents 用辅助功能操作其它应用上的控件。
    NSScreenCaptureUsageDescription: Enjoy Agents 截取窗口缩略图给 Computer Use 审批卡和右栏。
  target:
    - dmg
    - zip
linux:
  executableName: enjoy-agents
  icon: icon.png
  category: Development
  artifactName: enjoy-agents-${version}-linux.${ext}
  target:
    - AppImage
