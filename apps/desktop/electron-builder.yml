appId: com.enjoyagents.desktop
productName: Enjoy Agents
executableName: enjoy-agents
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - resources/**
  - node_modules/node-pty/**
npmRebuild: true
publish:
  provider: github
  owner: huangshh310
  repo: enjoy-agnets
  releaseType: release
win:
  executableName: enjoy-agents
  icon: icon.ico
  artifactName: enjoy-agents-${version}-win.${ext}
nsis:
  artifactName: enjoy-agents-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
mac:
  icon: icon.icns
  category: public.app-category.developer-tools
  artifactName: enjoy-agents-${version}-mac.${ext}
  target:
    - dmg
    - zip
linux:
  executableName: enjoy-agents
  icon: icon.png
  category: Development
  artifactName: enjoy-agents-${version}-linux.${ext}
  desktop:
    Name: Enjoy Agents
    StartupWMClass: enjoy-agents
  target:
    - AppImage
