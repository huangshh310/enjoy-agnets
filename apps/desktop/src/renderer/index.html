<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <title>Enjoy Agents</title>
    <link rel="icon" href="/enjoy-ui-kit/svg/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/enjoy-ui-kit/png/favicon-32.png" type="image/png" sizes="32x32" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: enjoy-asset:; media-src 'self' blob: enjoy-asset:; worker-src 'self' blob:; connect-src 'self' ws: http://localhost:* https: enjoy-asset:;"
    />
    <script>
      (function () {
        try {
          var dark = localStorage.getItem("boardui:theme") === "dark";
          document.documentElement.classList.toggle("dark", dark);
          var storedSkin = localStorage.getItem("boardui:skin");
          var skin = storedSkin === "glass" || storedSkin === "ink" ? storedSkin : "classic";
          document.documentElement.setAttribute("data-skin", skin);
        } catch (error) {
          document.documentElement.classList.remove("dark");
          document.documentElement.setAttribute("data-skin", "classic");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
