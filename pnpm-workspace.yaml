overrides:
  "@electron/get": "3.1.0"

allowBuilds:
  '@google/genai': true
  '@mongodb-js/zstd': true
  electron: true
  electron-winstaller: true
  esbuild: true
  node-liblzma: true
  protobufjs: true
  node-pty: true

