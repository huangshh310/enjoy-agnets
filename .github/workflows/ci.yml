name: CI
# retrigger batch-6 tip checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 桌面是三端产品（design/specs/architecture.md 不变量）：spawn / PATH / 路径分隔的回归必须在三台 runner 上各验一次。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 打包期的解析错误（无后缀导入、workspace 包别名）typecheck 抓不到，见 architecture.md 已知坑。
      # macos-latest 默认堆会在 electron-vite 打 main 时 OOM；测试过了才暴露。
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  contracts:
    # e2e 里除 agent-stub 外的 Electron 窗口流仍留本机；这里只跑纯 Node 的 IPC 合约 spec。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @enjoy-agents/desktop exec playwright test -c e2e/playwright.config.ts contracts.spec.ts

  e2e-window:
    # xvfb + Electron：agent-stub（含本会话允许跨轮）+ 回挂审批 + 知识库芯片 + 新对话/重启首发清稿。禁止 -g / only。
    runs-on: ubuntu-latest
    # E1 加了 queue-pause-e1.spec.ts（约 7 条真机用例），原 30 分钟已用到 ~20 分钟。
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update
      - run: sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libasound2t64 libgbm1 libxtst6 libatk-bridge2.0-0 libdrm2 libx11-xcb1 libfuse2 fonts-noto-cjk
      - run: pnpm --filter @enjoy-agents/desktop build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Playwright window e2e
        working-directory: apps/desktop
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" pnpm exec playwright test -c e2e/playwright.config.ts agent-stub.spec.ts approval-restart.spec.ts knowledge-source-chip.spec.ts first-send-bubble.spec.ts first-send-composer-clear.spec.ts first-send-preparing-ab.spec.ts first-send-watchdog-forced.spec.ts first-send-prepare-fail.spec.ts first-send-leave-empty.spec.ts first-send-attach-session-bind.spec.ts first-send-image-only.spec.ts draft-image-preview-return.spec.ts first-send-prep-images.spec.ts queued-image-send-now.spec.ts rewind-dialog.spec.ts composer-dock-attachment-tray.spec.ts thread-rail-click-through.spec.ts luna-155-patrol-fixes.spec.ts queue-sendnow-approval.spec.ts narrow-right-pane.spec.ts key-invalid-status.spec.ts setup-guide-reopen-overlay.spec.ts pre-output-rollback-gate2.spec.ts pre-output-rollback-r3.spec.ts pre-output-rollback-images.spec.ts base-p0-1-credential.spec.ts acp-import-isolation.spec.ts queue-pause-e1.spec.ts accent-persist-reload.spec.ts p3-queue-pause-copy.spec.ts
      - name: Upload queue-pause screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: queue-pause-e1-shots
          path: |
            apps/desktop/test-results/queue-pause-e1/
            apps/desktop/test-results/p3-queue-pause-copy/
            apps/desktop/test-results/pre-output-rollback-images/e1-p2-*.png
            apps/desktop/test-results/pre-output-rollback-images/r5-*-2-hidden-edited.png
          if-no-files-found: ignore
      - name: Upload first-send screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-send-composer-clear-shots
          path: apps/desktop/test-results/first-send-composer-clear/
          if-no-files-found: ignore
