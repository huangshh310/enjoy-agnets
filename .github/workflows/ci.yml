name: CI
# retrigger batch-6 tip checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # 桌面是三端产品（design/specs/architecture.md 不变量）：spawn / PATH / 路径分隔的回归必须在三台 runner 上各验一次。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # 打包期的解析错误（无后缀导入、workspace 包别名）typecheck 抓不到，见 architecture.md 已知坑。
      # macos-latest 默认堆会在 electron-vite 打 main 时 OOM；测试过了才暴露。
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  contracts:
    # e2e 里除 agent-stub 外的 Electron 窗口流仍留本机；这里只跑纯 Node 的 IPC 合约 spec。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @enjoy-agents/desktop exec playwright test -c e2e/playwright.config.ts contracts.spec.ts

  e2e-window:
    # xvfb + Electron：agent-stub（含本会话允许跨轮）+ 回挂审批 + 知识库芯片。禁止 -g / only。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update
      - run: sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libasound2t64 libgbm1 libxtst6 libatk-bridge2.0-0 libdrm2 libx11-xcb1 libfuse2
      - run: pnpm --filter @enjoy-agents/desktop build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Playwright window e2e
        working-directory: apps/desktop
        run: xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" pnpm exec playwright test -c e2e/playwright.config.ts agent-stub.spec.ts approval-restart.spec.ts knowledge-source-chip.spec.ts
