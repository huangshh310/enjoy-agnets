name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Assert tag matches desktop version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Release 只接受 v* tag（当前 ${GITHUB_REF}）"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$TAG" != "$PKG" ]]; then
            echo "tag v$TAG != apps/desktop version $PKG"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @enjoy-agents/desktop run build
      - name: Check packer deps
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          node -e "
            const { createRequire } = require('module')
            const path = require('path')
            const here = path.join(process.cwd(), 'package.json')
            const pkg = require(here)
            const updater = pkg.dependencies['electron-updater']
            console.log('electron-updater field', updater)
            if (!updater || updater.includes('catalog')) {
              console.error('electron-updater must be a semver, not catalog:')
              process.exit(1)
            }
            const req = createRequire(here)
            const eb = req.resolve('electron-builder/package.json')
            const abl = createRequire(eb).resolve('app-builder-lib/package.json')
            const getPkg = createRequire(abl).resolve('@electron/get/package.json')
            const getJson = require(getPkg)
            const get = require(path.dirname(getPkg))
            console.log('@electron/get', getJson.version)
            if (!get.ElectronDownloadCacheMode) {
              console.error('ElectronDownloadCacheMode missing; need @electron/get >= 3.1.0')
              process.exit(1)
            }
          "
      - name: Publish
        working-directory: apps/desktop
        run: pnpm exec electron-builder ${{ matrix.args }} --publish always
