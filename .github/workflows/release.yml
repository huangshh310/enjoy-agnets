name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Assert tag matches desktop version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Release 只接受 v* tag（当前 ${GITHUB_REF}）"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$TAG" != "$PKG" ]]; then
            echo "tag v$TAG != apps/desktop version $PKG"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @enjoy-agents/desktop run build
      - name: Publish
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.args }} --publish always
